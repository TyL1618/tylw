<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#0c0f0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f9f8" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{root}}assets/img/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site}}">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
{{head}}
<script>document.documentElement.classList.add('js')</script>
<script src="{{root}}assets/js/site.js" defer></script>
{{scripts}}
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#main">跳到主要內容</a>
<header class="site-header">
	<div class="wrap">
		<a class="brand" href="{{root}}index.html">{{> logo}}</a>
		<nav class="site-nav" aria-label="主要選單">{{nav}}</nav>
	</div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
	<div class="wrap">
		<span>&copy; 2026 {{handle}}</span>
		<span>純靜態網站・沒有追蹤・沒有外部資源・部分內容與 AI 協作（<a href="{{root}}main/about.html#ai">說明</a>）</span>
	</div>
</footer>
</body>
</html>
